name: 代码风格检查

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 uv
        uses: astral-sh/setup-uv@v6

      - name: 设置 Python 3.12
        run: uv python install 3.12

      - name: Ruff lint 检查
        run: uvx ruff check .

      - name: Ruff format 检查
        run: uvx ruff format --check .
